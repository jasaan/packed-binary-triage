[project]
name = "packed-binary-triage"
version = "0.1.0"
description = "Explainable static triage of Windows executables for packing, crypters and protectors (MITRE T1027.002), with YARA rules and a Defender hunt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pefile>=2023.2.7"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=8", "ruff>=0.5", "yara-python>=4.3"]

[project.scripts]
triage = "triage.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["triage"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
